[build-system]
requires = ["setuptools>=62.3"]
build-backend = "setuptools.build_meta"

[project]
name = "doubleml-pipeline"
version = "0.2.2"
description = "A causal inference pipeline utilizing DoubleML and FLAML"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0",
    "doubleml>=0.5.0",
    "FLAML>=1.0.0",
    "scipy",
    "patsy",
    "matplotlib",
    "cloudpickle",
    "joblib",
    "google-adk>=2.0.0"
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "black", "isort"]

[tool.setuptools.package-data]
doubleml_pipeline = ["skills/**/*", "docs/output_csv_schema.md"]
