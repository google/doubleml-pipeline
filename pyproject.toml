[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doubleml-pipeline"
version = "0.1.0"
description = "A causal inference pipeline utilizing DoubleML and FLAML"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0",
    "doubleml>=0.5.0",
    "FLAML>=1.0.0",
    "scipy",
    "patsy",
    "matplotlib",
    "cloudpickle",
    "joblib"
]

[project.optional-dependencies]
dev = ["pytest", "mypy", "black", "isort"]